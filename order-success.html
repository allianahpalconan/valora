<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Valora | Order Confirmed</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --primary: #5B2A86;
        --primary-dark: #431D65;
        --primary-light: #F3ECF8;
        --text: #21182A;
        --muted: #77717D;
        --background: #FAF9FB;
        --white: #FFFFFF;
        --border: #E9E4EC;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: var(--background);
        color: var(--text);
        min-height: 100vh;
    }

    a {
        text-decoration: none;
        color: inherit;
    }

    /* NAVBAR */

    nav {
        height: 76px;
        padding: 0 7%;
        background: var(--white);
        border-bottom: 1px solid var(--border);

        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .logo {
        color: var(--primary);
        font-size: 25px;
        font-weight: 700;
        letter-spacing: 1.5px;
    }

    .nav-links {
        display: flex;
        gap: 32px;
        list-style: none;
    }

    .nav-links a {
        color: #625B67;
        font-size: 13px;
    }

    .nav-links a:hover {
        color: var(--primary);
    }

    .nav-actions {
        display: flex;
        align-items: center;
        gap: 18px;
    }

    .login {
        padding: 9px 17px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
    }

    .cart {
        width: 38px;
        height: 38px;
        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        background: var(--primary-light);
        color: var(--primary);
        font-size: 17px;
    }

    /* SUCCESS */

    .success-container {
        min-height: calc(100vh - 76px);
        padding: 80px 20px;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .success-card {
        width: 100%;
        max-width: 650px;

        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 10px;

        padding: 55px 45px;
        text-align: center;
    }

    .success-icon {
        width: 80px;
        height: 80px;

        margin: 0 auto 25px;

        border-radius: 50%;

        background: var(--primary-light);
        color: var(--primary);

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 36px;
        font-weight: 700;
    }

    .success-card h1 {
        font-size: 30px;
        margin-bottom: 12px;
    }

    .success-message {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
        margin-bottom: 30px;
    }

    .order-number {
        background: var(--primary-light);
        border-radius: 6px;
        padding: 15px;
        margin-bottom: 30px;
    }

    .order-number span {
        display: block;
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 5px;
    }

    .order-number strong {
        color: var(--primary);
        font-size: 16px;
    }

    .buttons {
        display: flex;
        justify-content: center;
        gap: 12px;
    }

    .btn {
        padding: 12px 20px;
        border-radius: 5px;
        font-size: 12px;
        font-weight: 600;
        transition: 0.2s;
    }

    .shop-btn {
        background: var(--primary);
        color: white;
    }

    .shop-btn:hover {
        background: var(--primary-dark);
    }

    .home-btn {
        border: 1px solid var(--border);
        color: var(--text);
    }

    .home-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
    }

    /* FOOTER */

    footer {
        background: #24152F;
        color: white;
        padding: 30px 7% 20px;
        text-align: center;
    }

    .copyright {
        color: #928698;
        font-size: 10px;
    }

    /* RESPONSIVE */

    @media (max-width: 700px) {

        .nav-links {
            display: none;
        }

        .success-container {
            padding: 50px 20px;
        }

        .success-card {
            padding: 40px 25px;
        }

        .success-card h1 {
            font-size: 25px;
        }

        .buttons {
            flex-direction: column;
        }

        .btn {
            width: 100%;
        }

    }

</style>
```

</head>

<body>

```
<!-- NAVBAR -->

<nav>

    <a href="index.html" class="logo">
        VALORA
    </a>

    <ul class="nav-links">

        <li>
            <a href="index.html">
                Home
            </a>
        </li>

        <li>
            <a href="shop.html">
                Shop
            </a>
        </li>

        <li>
            <a href="#">
                Categories
            </a>
        </li>

        <li>
            <a href="#">
                Deals
            </a>
        </li>

        <li>
            <a href="#">
                About
            </a>
        </li>

    </ul>

    <div class="nav-actions">

        <a href="login.html" class="login">
            Login
        </a>

        <a href="cart.html"
           class="cart"
           aria-label="Shopping cart">
            🛒
        </a>

    </div>

</nav>


<!-- SUCCESS -->

<main class="success-container">

    <section class="success-card">

        <div class="success-icon">
            ✓
        </div>

        <h1>
            Order Confirmed!
        </h1>

        <p class="success-message">
            Thank you for shopping with Valora.
            Your order has been successfully placed
            and is now being processed.
        </p>

        <div class="order-number">

            <span>
                Order Number
            </span>

            <strong id="orderNumber">
                VALORA-000000
            </strong>

        </div>

        <div class="buttons">

            <a href="shop.html"
               class="btn shop-btn">
                Continue Shopping
            </a>

            <a href="index.html"
               class="btn home-btn">
                Back to Home
            </a>

        </div>

    </section>

</main>


<!-- FOOTER -->

<footer>

    <div class="copyright">
        © 2026 Valora. All Rights Reserved.
    </div>

</footer>


<script>

    function generateOrderNumber() {

        const number =
            Math.floor(
                100000 + Math.random() * 900000
            );

        document.getElementById("orderNumber")
            .textContent =
            "VALORA-" + number;

    }

    document.addEventListener(
        "DOMContentLoaded",
        generateOrderNumber
    );

</script>

</body>

</html>
